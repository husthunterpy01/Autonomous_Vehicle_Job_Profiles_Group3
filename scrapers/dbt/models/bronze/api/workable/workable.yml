version: 2

models:
  - name: workable
    description: Workable widget-API jobs parsed from bronze.raw_responses.

unit_tests:
  - name: workable_maps_jobs
    model: workable
    given:
      - input: source("bronze", "raw_responses")
        format: sql
        rows: |
          select
            'api'::text as source,
            'workable'::text as source_system,
            'DeepRoute.ai'::text as company_name,
            'CN'::text as headquarter,
            $json${"jobs":[{"shortcode":"7A1D662123","title":"AD Systems Project Manager","description":"<p>Lead projects</p>","city":"Fremont","state":"","country":"United States","url":"https://apply.workable.com/j/7A1D662123","shortlink":"https://apply.workable.com/j/7A1D662123","created_at":"2026-03-23","published_on":"2026-06-06","employment_type":"Full-time"}]}$json$::jsonb as body
    expect:
      rows:
        - ats_name: workable
          source_job_id: 7A1D662123
          company_name: DeepRoute.ai
          job_name: AD Systems Project Manager
          job_description: "<p>Lead projects</p>"
          headquarter: CN
          location: "Fremont, United States"
          job_url: https://apply.workable.com/j/7A1D662123
          job_uploaded_at: "2026-06-06"
          employment_type: Full-time
