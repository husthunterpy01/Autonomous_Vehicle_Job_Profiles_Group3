version: 2

models:
  - name: ashby
    description: Ashby jobs parsed from bronze.raw_responses.

unit_tests:
  - name: ashby_maps_jobs_and_secondary_locations
    model: ashby
    given:
      - input: source("bronze", "raw_responses")
        format: sql
        rows: |
          select
            'api'::text as source,
            'ashby'::text as source_system,
            '42dot'::text as company_name,
            'KR'::text as headquarter,
            $json${"jobs":[{"title":"Software Engineer","descriptionPlain":"Work on autonomy.","location":"Seoul","secondaryLocations":[{"location":"Palo Alto"}],"publishedAt":"2026-02-01T00:00:00Z","jobUrl":"https://jobs.ashbyhq.com/42dot/abc","employmentType":"Full-time"}]}$json$::jsonb as body
    expect:
      rows:
        - ats_name: ashby
          job_name: Software Engineer
          location: "Seoul | Palo Alto"
          employment_type: Full-time
