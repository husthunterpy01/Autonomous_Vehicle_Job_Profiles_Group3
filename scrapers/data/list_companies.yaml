# scrapers/companies.yaml
#
# Single source of truth for which companies get scraped and how.
# Loaded by scrapers/companies.py -> CompanyConfig objects.
# ATS assignments from docs/endpoint-register.md (verified 2026-08-27).
#
# Fields
#   key      required  stable lowercase identifier; used in MinIO paths and the
#                      Postgres (company, job_id) unique constraint. NEVER rename
#                      after first scrape — it will orphan existing rows.
#   name     required  display name for the frontend
#   url      required  careers page where one exists, otherwise the company site
#   country  required  ISO 3166-1 alpha-2 of HQ; fallback when a posting has no
#                      structured location
#   ats      required  key into ats_sources.yaml:
#                      greenhouse | lever | ashby | workday | smartrecruiters |
#                      personio | html (no API, scrape) | none (no source found)
#   slug     optional  board token / site ID / company ID as it appears in the
#                      ATS URL. Required for every ats except html and none.
#   params   optional  extra template values; Workday needs host/tenant/site
#   enabled  required  false = skipped by run_all.py
#
# Order follows the client-supplied company list.

companies:
