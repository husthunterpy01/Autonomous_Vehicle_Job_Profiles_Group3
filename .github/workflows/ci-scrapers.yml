name: autonomous-job-scrapers-ci

on:
  pull_request:
    branches: [ main ]
    paths:
      - "scrapers/**"
      - ".github/workflows/ci-scrapers.yml"
  push:
    branches: [ main ]
    paths:
      - "scrapers/**"
      - ".github/workflows/ci-scrapers.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install scraper test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scrapers/requirements-test.txt
      - name: Run unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest scrapers/tests/unit_test -v
      - name: Run integration tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest scrapers/tests/integration_test -v
