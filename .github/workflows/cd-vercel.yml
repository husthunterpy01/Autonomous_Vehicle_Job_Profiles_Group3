name: Deploy to Vercel

# One-time setup - add these in GitHub: Settings > Secrets and variables > Actions
#   VERCEL_TOKEN       token from https://vercel.com/account/tokens
#   VERCEL_ORG_ID      "orgId" in the local .vercel/project.json
#   VERCEL_PROJECT_ID  "projectId" in the local .vercel/project.json

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/app/**"
      - "backend/requirements.txt"
      - "api/**"
      - "vercel.json"
      - ".vercelignore"
      - ".github/workflows/cd-vercel.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check Vercel secrets are configured
        run: |
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set (see the header of .github/workflows/cd-vercel.yml)"
              missing=1
            fi
          done
          exit $missing

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@59

      # Vercel's own remote builders have this pre-installed; building
      # locally on this runner (see the pull/build/deploy steps below)
      # means it doesn't, and api/index.py's Python build needs it. Pinned
      # action instead of curling astral.sh's install script into `sh` -
      # this job's env carries VERCEL_TOKEN, so a remote script fetched
      # over the network isn't something to run unpinned in it.
      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          version: "0.12.17"

      # workflow_dispatch lets this run against any branch (for testing
      # this workflow itself, see the PR discussion) - only main's push
      # trigger should ever touch production. Everything else gets a
      # preview environment/deploy instead, so a manual test run can't
      # overwrite the live site or spend the prod deploy's upload quota.
      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }} --token="$VERCEL_TOKEN"

      - name: Build
        run: vercel build ${{ github.ref == 'refs/heads/main' && '--prod' || '' }} --token="$VERCEL_TOKEN"

      - name: Strip unused files from the function's filePathMap
        run: |
          shopt -s globstar nullglob
          for f in .vercel/output/functions/**/.vc-config.json; do
            jq '.filePathMap |= with_entries(select(.key | (startswith("notebooks/") or startswith("scrapers/data/snapshots/") or startswith("frontend/out/")) | not))' "$f" > "$f.tmp"
            mv "$f.tmp" "$f"
          done

      - name: Deploy prebuilt output
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt ${{ github.ref == 'refs/heads/main' && '--prod' || '' }} --yes --token "$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: echo "Deployed to ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
