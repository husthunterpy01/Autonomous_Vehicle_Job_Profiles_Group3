name: Deploy to Vercel

# One-time setup - add these in GitHub: Settings > Secrets and variables > Actions
#   VERCEL_TOKEN       token from https://vercel.com/account/tokens
#   VERCEL_ORG_ID      "orgId" in the local .vercel/project.json
#   VERCEL_PROJECT_ID  "projectId" in the local .vercel/project.json

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/app/**"
      - "backend/requirements.txt"
      - "api/**"
      - "vercel.json"
      - ".vercelignore"
      - ".github/workflows/cd-vercel.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check Vercel secrets are configured
        run: |
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set (see the header of .github/workflows/cd-vercel.yml)"
              missing=1
            fi
          done
          exit $missing

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@59

      # Vercel's own remote builders have this pre-installed; building
      # locally on this runner (see the pull/build/deploy steps below)
      # means it doesn't, and api/index.py's Python build needs it.
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"

      # Something under .vercel/output ends up with symlinks to
      # notebooks/*.ipynb and a scrapers/data/snapshots/ image that
      # .vercelignore correctly keeps out of the actual upload, producing
      # a dangling symlink (readlink ENOENT) on Vercel's remote finalize
      # step - confirmed across two live runs, exact same 6 files both
      # times. None of this is used at runtime; stripping the symlinks
      # here is more reliable than fighting for a vercel.json/next.config
      # exclusion option (two tried, neither worked - see the PR
      # discussion). Matches by symlink target (-lname) across the whole
      # .vercel/output tree rather than assuming a specific subdirectory,
      # since local reproduction to confirm the exact location hit
      # environment issues unrelated to the actual bug.
      - name: Strip unused files from the built output
        run: |
          find .vercel/output -type l \
            \( -lname '*/notebooks/*' -o -lname '*/scrapers/data/snapshots/*' \) \
            -print -delete
          echo "Remaining symlinks under .vercel/output (diagnostic, in case the error recurs):"
          find .vercel/output -type l

      - name: Deploy prebuilt output
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: echo "Deployed to ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
