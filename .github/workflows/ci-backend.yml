name: autonomous-job-backend-ci

on:
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
      POSTGRES_USER: team3
      POSTGRES_DB: autojobdatabase
      DATABASE_URL: postgresql://team3@localhost:5432/autojobdatabase
      BE9_TEST_POSTGRES: '1'
      BE9_TEST_DATABASE_URL: postgresql://team3@localhost:5432/autojobdatabase
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: team3
          POSTGRES_DB: autojobdatabase
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@v2
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.10'
    - name: Generate ephemeral test signing key
      run: python -c "import os, secrets; open(os.environ['GITHUB_ENV'], 'a').write('JWT_SECRET_KEY=' + secrets.token_hex(32) + '\n')"
    - name: Install dependencies
      working-directory: backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Check convention
      working-directory: backend
      run: |
        pip install ruff
        ruff check .
    - name: Run unit tests
      working-directory: backend
      run: |
        python -m pytest tests/unit_test -v
    - name: Run integration tests
      working-directory: backend
      run: |
        python -m pytest tests/integration_test -v
